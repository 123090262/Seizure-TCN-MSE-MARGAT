project:
  name: seizure-tcn-mse-margat
  output_dir: outputs
  seed: 42

data:
  dataset: chbmit
  root: data/CHBMIT
  processed_dir: data/processed/chbmit
  metadata_path: data/processed/chbmit/metadata.csv
  splits_dir: data/splits
  sampling_rate: 256
  channel_set: common_18
  custom_channels: []

preprocessing:
  sampling_rate: 256
  channel_set: common_18
  bandpass:
    enabled: true
    low: 0.5
    high: 70.0
    order: 5
  notch:
    enabled: true
    freq: 60.0
  artifact_screening:
    enabled: true
    amplitude_threshold_uv: 1000
  save_format: npy
  overwrite_processed: false

windowing:
  task: seizure_detection
  window_size_samples: 1024
  window_size_sec: 4.0
  ictal_overlap: 0.25
  interictal_overlap: 0.0
  interictal_exclusion_sec: 3600
  balance_after_split: true
  balance_ratio: 1.0
  balance_sets: [train, val, test]

normalization:
  method: zscore
  scope: train_only
  per_channel: true
  eps: 1.0e-6

training:
  seed: 42
  epochs: 100
  batch_size: 64
  num_workers: 0
  # Exactly one imbalance correction mechanism is active.
  balance_strategy: sampler  # sampler | class_weight | none
  optimizer: adamw
  lr: 1e-4
  weight_decay: 5e-4
  scheduler: cosine
  early_stopping:
    monitor: val_accuracy
    mode: max
    patience: 10
  loss:
    name: cross_entropy
  amp: true
  grad_clip: 5.0
  logger: tensorboard

evaluation:
  threshold: 0.5
